name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Build container and check startup
        run: |
          docker build --tag boilerplate-test .
          docker run -d --name api -p 8080:8080 boilerplate-test
          trap 'docker logs api; docker rm -f api' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080/healthz
