# Generated by scripts/setup.py. Editable; rerunning setup previews differences.
name: Deploy
on:
  push:
    branches: [@@BRANCH@@]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-progress migration. GitHub may replace older queued runs.
concurrency:
  group: @@SERVICE@@
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == @@REF@@
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: @@PROJECT@@
      REGION: @@REGION@@
      SERVICE: @@SERVICE@@
      RESOURCE: @@RESOURCE@@
      RUNTIME: @@RUNTIME@@
      DEPLOYER: @@DEPLOYER@@
      PUBLIC: @@PUBLIC@@
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: @@PROJECT@@
          workload_identity_provider: @@PROVIDER@@
          service_account: @@DEPLOYER@@
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and publish immutable image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          image="$REGION-docker.pkg.dev/$PROJECT/$RESOURCE/$SERVICE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --tag "$image" .
          docker push "$image"
          digest=$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')
          test -n "$digest"
          echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT/$RESOURCE/$SERVICE@$digest" >> "$GITHUB_ENV"
      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$RESOURCE-migrate" \
            --project="$PROJECT" --region="$REGION" --image="$IMAGE" \
            --service-account="$RUNTIME" --labels="bootstrap_id=$RESOURCE" \
            --set-secrets="DATABASE_URL=$RESOURCE-migrations:latest" \
            --command=alembic --args=upgrade,head \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=600s \
            --memory=512Mi --cpu=1 --quiet
          gcloud run jobs execute "$RESOURCE-migrate" \
            --project="$PROJECT" --region="$REGION" --wait --quiet
      - name: Deploy API
        shell: bash
        run: |
          set -euo pipefail
          access=--no-allow-unauthenticated
          if [ "$PUBLIC" = true ]; then access=--allow-unauthenticated; fi
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT" --region="$REGION" --image="$IMAGE" \
            --service-account="$RUNTIME" --labels="bootstrap_id=$RESOURCE" \
            --set-secrets="DATABASE_URL=$RESOURCE-database:latest" \
            --port=8080 --min=0 --max=3 --memory=512Mi --cpu=1 \
            --invoker-iam-check "$access" --quiet
          url=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          echo "SERVICE_URL=$url" >> "$GITHUB_ENV"
      - name: Check deployed API
        shell: bash
        run: |
          set -euo pipefail
          token=$(gcloud auth print-identity-token \
            --impersonate-service-account="$DEPLOYER" --audiences="$SERVICE_URL" --include-email)
          echo "::add-mask::$token"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 -H "Authorization: Bearer $token" "$SERVICE_URL/"
          echo "Deployed API: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
